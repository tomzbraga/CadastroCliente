<div class="overlay" (click)="onFechar()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="btn-fechar" type="button" (click)="onFechar()">✕</button>

    <h2>Dados do Cliente</h2>

    <form [formGroup]="form" (ngSubmit)="onSalvar()">
      <label>
        Nome completo*
        <input type="text" formControlName="nome" />
      </label>

      <label>
        Data de nascimento*
        <input type="date" formControlName="dataNascimento" />
      </label>

      <label>
        RG*
        <input type="text" formControlName="rg" />
      </label>

      <label>
        Endereço*
        <input type="text" formControlName="endereco" />
      </label>

      <div class="gender-options">
        <p>Gênero*</p>
        <label>
          <input type="radio" formControlName="genero" value="M" />
          Masculino
        </label>
        <label>
          <input type="radio" formControlName="genero" value="F" />
          Feminino
        </label>
<label>
          <input type="radio" formControlName="genero" value="O" />
          Outro
        </label>
      </div>

      <label>
        Telefone
        <input type="text" formControlName="telefone">
      </label>

      <label>
        Email
        <input type="email" formControlName="email">
      </label>

      <div class="acoes">
        <button type="button" class="btn-excluir" (click)="onExcluir()">Excluir</button>
        <button type="submit" class="btn-salvar" [disabled]="form.invalid">Salvar</button>
      </div>

    </form>
  </div>
</div>
