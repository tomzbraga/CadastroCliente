<section class="container">
  <h1>Cadastro de Cliente</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <p>Itens com * são obrigatórios</p>

    <input type="text" placeholder="Nome completo*" formControlName="nome" />

    <input type="date" placeholder="Data de nascimento*" formControlName="dataNascimento" />

    <input type="text" placeholder="RG*" formControlName="rg" />

    <input type="text" placeholder="Endereço*" formControlName="endereco" />

    <div class="gender-options">
      <p>Gênero*</p>
      <label>
        <input type="radio" formControlName="genero" value="M" />
        Masculino
      </label>
      <label>
        <input type="radio" formControlName="genero" value="F" />
        Feminino
      </label>
      <label>
        <input type="radio" formControlName="genero" value="O" />
        Outro
      </label>
    </div>

    <input type="text" placeholder="Telefone" formControlName="telefone" />
    <input type="email" placeholder="Email" formControlName="email" />

    <button type="submit" [disabled]="form.invalid">Cadastrar</button>
  </form>
</section>
