<section class="container">
  <h1>Clientes Cadastrados</h1>
  <table>
    <thead>
      <tr>
        <th class="col-id">ID</th>
        <th class="col-nome">Nome</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cliente of clientes()">
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nome }}</td>
      </tr>
    </tbody>
  </table>
</section>
